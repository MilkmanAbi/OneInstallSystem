# ================================================================
#  ois.conf  --  the only file you need to edit
#  Full reference: docs/02-CONFIG.md
# ================================================================

# REQUIRED. Identifier for your app. [A-Za-z0-9_-] only.
app_name = myapp

# Name of the executable your build produces AND installs as.
# Defaults to app_name.
binary = myapp

# Shown in headers. Defaults to app_name.
display_name = My App

# owner/repo on GitHub. Enables `myapp --update` and `ois check`.
# Without it, OIS still installs and manages -- it just can't update.
github = you/myapp

# notify | auto | manual        (default: notify)
update_mode = notify


# ---------------------------------------------------------------
# [build] -- everything is optional; auto-detection handles most
# projects. Your CMakeLists.txt / Makefile stays authoritative.
# ---------------------------------------------------------------
# [build]
# system     = auto            # auto|make|cmake|meson|cargo|go|zig|custom
# out        = myapp           # artifact name, if it differs from binary
# target     = myapp           # named target for cmake/make/meson
# cmake_opts = -DENABLE_X=ON   # passed verbatim to cmake configure
# make_opts  = V=1
# jobs       = auto
# custom     = ./build.sh --release


# ---------------------------------------------------------------
# [deps] -- one word per dependency where possible.
# OIS knows ~45 common libraries and tools across 13 package
# managers. Overrides always win. See docs/02-CONFIG.md.
# ---------------------------------------------------------------
# [deps]
# ncurses                      # alias table: correct package everywhere
# openssl >= 3.0               # with a version constraint
# jq                           # same name on every platform
# ffmpeg.apt = ffmpeg-dev      # override only the platform that differs
# ripgrep.cmd = rg             # probe as a TOOL      (command -v)
# mylib.pc = mylib-2.0         # probe as a LIBRARY   (pkg-config)
# mylib.header = mylib.h       # probe by header presence

# [deps.optional]
# chafa                        # missing -> a note, never a failure


# ---------------------------------------------------------------
# [owns] -- what belongs to your app. Drives uninstall AND the
# security boundary for runtime claims. Defaults shown; you only
# need this section if your app writes somewhere unusual.
# ---------------------------------------------------------------
# [owns]
# config = $XDG_CONFIG_HOME/myapp    # kept unless --purge
# data   = $XDG_DATA_HOME/myapp      # kept unless --purge
# cache  = $XDG_CACHE_HOME/myapp     # always removed
# state  = $XDG_STATE_HOME/myapp     # kept unless --purge
# extra  = /opt/myapp/plugins        # repeatable
