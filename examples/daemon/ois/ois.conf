app_name = exampled
binary = exampled
display_name = Example Daemon
github = example/exampled

[service]
enable      = true
args        = --config $XDG_CONFIG_HOME/exampled/config.toml
description = Example background daemon
restart     = on-failure
after       = network

[owns]
config = $XDG_CONFIG_HOME/exampled
state  = $XDG_STATE_HOME/exampled
